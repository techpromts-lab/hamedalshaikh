<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080713">
<meta name="description" content="Hamed Alshaikh — Creative Developer and founder of techpromts.">
<title>Hamed Alshaikh — Creative Developer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="preload" as="image" href="https://i.ibb.co/FL9m3k7V/IMG-2272.jpg" fetchpriority="high">

<style>
:root {
  --bg: #080713;
  --surface: #151124;
  --white: #f9f7ff;
  --muted: #aaa3bb;
  --purple: #bb9cff;
  --cyan: #8cece5;
  --lime: #dfff96;
  --line: rgba(255,255,255,.13);
  --font: "Manrope", sans-serif;
  --display: "Space Grotesk", sans-serif;
  --mono: "DM Mono", monospace;
  --ease: cubic-bezier(.2,.8,.2,1);
  --ease-out: cubic-bezier(.16,1,.3,1);
}

* { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  scroll-padding-top: 95px;
  overflow-x: clip;
}

body {
  margin: 0;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--white);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; }

a:focus-visible,
button:focus-visible {
  outline: 2px solid var(--lime);
  outline-offset: 4px;
}

::selection {
  background: var(--purple);
  color: #080713;
}

.container {
  width: min(1160px, calc(100% - 36px));
  margin: auto;
}

.page { position: relative; z-index: 2; }

.gradient {
  background: linear-gradient(105deg,#fff,#c7adff,#8cece5,#dfff96);
  background-size: 250% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: gradientFlow 8s ease-in-out infinite alternate;
}

.eyebrow {
  font: 10px/1.5 var(--mono);
  letter-spacing: .17em;
  color: var(--purple);
}

.eyebrow::before {
  content: "";
  display: inline-block;
  width: 25px;
  height: 1px;
  background: var(--purple);
  vertical-align: middle;
  margin-right: 11px;
  transform-origin: left;
  animation: eyebrowLine 3.5s var(--ease-out) infinite alternate;
}

.section { padding: 95px 0; }

.section-title {
  font: 600 clamp(44px, 10vw, 90px)/1.02 var(--display);
  letter-spacing: -.075em;
  margin: 24px 0 30px;
}

.muted { color: #827a92; }

/* ====== PREMIUM SVG ARROWS ====== */
.arrow-icon {
  display: inline-block;
  vertical-align: middle;
  transition: transform .35s var(--ease-out);
}

/* ====== SKIP LINK ====== */
.skip-link {
  position: fixed;
  top: -100px;
  left: 12px;
  z-index: 100000;
  padding: 12px 20px;
  border-radius: 12px;
  background: var(--lime);
  color: #0e1407;
  font: 700 12px var(--display);
  transition: top .3s var(--ease-out);
}
.skip-link:focus { top: 12px; }

/* ====== CUSTOM CURSOR ====== */
.cursor-dot,
.cursor-ring {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 99999;
  pointer-events: none;
  border-radius: 50%;
  opacity: 0;
  transition: opacity .3s var(--ease-out);
  will-change: transform;
}
body.cursor-active .cursor-dot,
body.cursor-active .cursor-ring { opacity: 1; }

.cursor-dot {
  width: 6px;
  height: 6px;
  background: var(--lime);
  box-shadow: 0 0 12px rgba(223,255,150,.8);
}

.cursor-ring {
  width: 40px;
  height: 40px;
  border: 1px solid rgba(187,156,255,.55);
  transition:
    opacity .3s var(--ease-out),
    width .3s var(--ease-out),
    height .3s var(--ease-out),
    border-color .3s var(--ease-out),
    background .3s var(--ease-out);
}

.cursor-ring.hover {
  width: 64px;
  height: 64px;
  border-color: var(--lime);
  background: rgba(223,255,150,.07);
}

@media (pointer: coarse) {
  .cursor-dot, .cursor-ring { display: none; }
}

/* ====== BACKGROUND ====== */
#cosmos {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

.ambient {
  position: fixed;
  inset: -25%;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 28% 23% at 20% 18%, rgba(124,69,237,.2), transparent),
    radial-gradient(ellipse 28% 20% at 80% 70%, rgba(25,163,175,.13), transparent);
  animation: aurora 22s ease-in-out infinite alternate;
}

.grid-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size: 70px 70px;
  mask-image: linear-gradient(#000,transparent 90%);
  -webkit-mask-image: linear-gradient(#000,transparent 90%);
}

.progress {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 120;
  width: 0;
  height: 2px;
  background: linear-gradient(90deg,var(--purple),var(--cyan),var(--lime));
  box-shadow:
    0 0 12px rgba(187,156,255,.75),
    0 0 26px rgba(140,236,229,.35);
  transition: width .08s linear;
}

/* ====== LOADER ====== */
.loader {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: grid;
  place-items: center;
  background: #080713;
  transition:
    opacity .85s var(--ease-out),
    visibility .85s var(--ease-out),
    transform .85s var(--ease-out),
    filter .85s var(--ease-out);
}

.loader.hidden {
  opacity: 0;
  visibility: hidden;
  transform: scale(1.07);
  filter: blur(16px);
  pointer-events: none;
}

.loader-content { position: relative; text-align: center; }

.loader-orb {
  width: 132px;
  height: 132px;
  margin: 0 auto 32px;
  padding: 3px;
  border-radius: 50%;
  position: relative;
  display: grid;
  place-items: center;
  border: 1px solid rgba(187,156,255,.5);
  background: linear-gradient(145deg,#bd9cff,#5c3da9);
  box-shadow:
    0 0 80px rgba(160,100,255,.2),
    inset 0 0 30px rgba(0,0,0,.25);
  animation: loaderOrbIn .9s var(--ease-out) both;
}

.loader-orb::before,
.loader-orb::after {
  content: "";
  position: absolute;
  inset: -15px;
  border: 1px dashed rgba(140,236,229,.45);
  border-radius: 50%;
  animation: spin 7s linear infinite;
}

.loader-orb::after {
  inset: -28px;
  border-color: rgba(187,156,255,.22);
  animation: spinReverse 12s linear infinite;
}

.loader-photo {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,.35);
}
.loader-photo.failed { display: none; }

.loader-title {
  font: 700 23px var(--display);
  letter-spacing: -.06em;
  animation: fadeUp .8s var(--ease-out) .15s both;
}

.loader-subtitle {
  margin-top: 8px;
  font: 9px var(--mono);
  letter-spacing: .2em;
  color: #a99dbb;
  animation: fadeUp .8s var(--ease-out) .25s both;
}

.loader-line {
  width: 170px;
  height: 2px;
  margin: 25px auto 0;
  background: #373044;
  overflow: hidden;
  animation: fadeUp .8s var(--ease-out) .35s both;
}

.loader-line::after {
  content: "";
  display: block;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg,var(--purple),var(--cyan));
  transform-origin: left;
  animation: loadingBar 1.15s var(--ease-out) .1s forwards;
}

.loader-percent {
  margin-top: 10px;
  font: 9px var(--mono);
  letter-spacing: .25em;
  color: #8f85a3;
  animation: fadeUp .8s var(--ease-out) .45s both;
}

/* ====== NAVIGATION ====== */

/* Status pill — desktop only */
.navbar {
  display: none;
}

@media (min-width: 1020px) {
  .navbar {
    position: fixed;
    z-index: 100;
    top: 12px;
    right: 35px;
    display: flex;
    align-items: center;
    min-height: 46px;
    padding: 9px 16px;
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 22px;
    background: rgba(19,15,32,.83);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    box-shadow: 0 15px 45px rgba(0,0,0,.25);
  }
}

.nav-status {
  display: flex;
  align-items: center;
  color: #c7bdd4;
  font: 9px var(--mono);
  white-space: nowrap;
}

.nav-status::before {
  content: "";
  display: inline-block;
  width: 7px;
  height: 7px;
  margin-right: 9px;
  border-radius: 50%;
  background: var(--lime);
  box-shadow: 0 0 13px var(--lime);
  animation: statusPulse 2.6s ease-in-out infinite;
}

/* Main nav — always visible, centered pill */
.nav-links {
  position: fixed;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 99;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 6px;
  border: 1px solid rgba(255,255,255,.16);
  border-radius: 22px;
  background: rgba(19,15,32,.83);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  box-shadow: 0 15px 45px rgba(0,0,0,.25);
  max-width: calc(100% - 24px);
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.nav-links::-webkit-scrollbar { display: none; }

.nav-links a {
  position: relative;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 10px;
  font-weight: 700;
  color: #d4cddd;
  white-space: nowrap;
  flex-shrink: 0;
  transition: background .25s, color .25s;
}

.nav-links a:hover { background: rgba(187,156,255,.12); }
.nav-links a.active { color: var(--purple); }

.nav-links a::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 4px;
  width: 0;
  height: 2px;
  border-radius: 2px;
  background: var(--lime);
  box-shadow: 0 0 10px var(--lime);
  transform: translateX(-50%);
  transition: width .35s var(--ease-out);
}

.nav-links a.active::after { width: 14px; }

.nav-links .special {
  text-align: center;
  background: var(--purple);
  color: #130d20;
  margin-left: 4px;
  border-radius: 50px;
  padding-inline: 16px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.nav-links .special::after { display: none; }
.nav-links .special:hover { background: white; }
.nav-links .special .arrow-icon { width: 9px; height: 9px; }

/* Compact nav on small screens */
@media (max-width: 700px) {
  .nav-links a {
    padding: 8px 10px;
    font-size: 9px;
  }
  .nav-links .special { padding-inline: 10px; }
}

/* ====== BUTTONS ====== */
.buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 27px; }

.btn {
  position: relative;
  overflow: hidden;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
  min-height: 52px;
  padding: 14px 20px;
  border-radius: 100px;
  font-size: 10px;
  font-weight: 800;
  transition:
    transform .45s var(--ease-out),
    background .3s,
    box-shadow .3s;
}

.btn .arrow-icon {
  width: 11px;
  height: 11px;
  margin-left: -8px;
}

.btn:hover .arrow-icon { transform: translate(3px, -3px); }

.btn::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(105deg,transparent 32%,rgba(255,255,255,.42) 50%,transparent 68%);
  transform: translateX(-130%);
  transition: transform .85s var(--ease-out);
}
.btn:hover::after { transform: translateX(130%); }

.btn.primary {
  background: var(--lime);
  color: #0e1407;
  box-shadow: 0 12px 38px rgba(223,255,150,.13);
}
.btn.primary:hover {
  background: white;
  box-shadow: 0 18px 50px rgba(223,255,150,.26);
}

.btn.secondary {
  border: 1px solid rgba(255,255,255,.25);
  background: rgba(255,255,255,.055);
}
.btn.secondary:hover {
  background: rgba(187,156,255,.17);
  border-color: rgba(187,156,255,.5);
}

/* ====== HERO ====== */
.hero {
  min-height: 100svh;
  padding: 145px 0 65px;
  overflow: hidden;
}

.hero-kicker {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 10px 13px;
  border: 1px solid rgba(187,156,255,.3);
  border-radius: 100px;
  background: rgba(187,156,255,.09);
  color: #dacaff;
  font: 9px var(--mono);
  letter-spacing: .12em;
}
.hero-kicker i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--lime);
  box-shadow: 0 0 12px var(--lime);
  animation: dotPulse 2.4s ease-in-out infinite;
}

.hero-title {
  font: 700 clamp(62px,16vw,135px)/.89 var(--display);
  letter-spacing: -.095em;
  margin: 33px 0 24px;
}
.hero-title span { display: block; }
.hero-title .outline {
  color: transparent;
  -webkit-text-stroke: 1px rgba(255,255,255,.75);
}

.hero-desc {
  max-width: 530px;
  color: #afa8bf;
  font-size: 13px;
  line-height: 1.95;
}
.hero-desc strong { color: white; }

/* ====== ENERGY ====== */
.energy-stage { position: relative; aspect-ratio: 1; isolation: isolate; }

.energy-halo {
  position: absolute;
  inset: 5%;
  border-radius: 50%;
  background: radial-gradient(circle,rgba(157,96,255,.27),transparent 68%);
  filter: blur(18px);
  animation: haloPulse 6s ease-in-out infinite alternate;
}

.energy-ring {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}

.energy-ring.outer {
  inset: 5%;
  border: 1px solid rgba(187,156,255,.28);
  animation: spin 30s linear infinite;
}
.energy-ring.outer::before {
  content: "";
  position: absolute;
  left: 50%;
  top: -5px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--lime);
  box-shadow: 0 0 18px var(--lime);
  animation: dotPulse 2.8s ease-in-out infinite;
}

.energy-ring.middle {
  inset: 12%;
  border: 1px dashed rgba(140,236,229,.32);
  animation: spinReverse 22s linear infinite;
}

.energy-ring.inner {
  inset: 19%;
  border: 1px solid rgba(255,255,255,.13);
  animation: spin 16s linear infinite;
}
.energy-ring.inner::after {
  content: "";
  position: absolute;
  right: 7%;
  bottom: 9%;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 17px var(--cyan);
  animation: dotPulse 3.4s ease-in-out infinite;
}

.energy-canvas {
  position: absolute;
  inset: 0;
  z-index: 5;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* ====== PROFILE ====== */
.profile-stage { width: min(100%, 390px); margin: 24px auto 0; }

.profile-circle {
  position: absolute;
  inset: 20%;
  z-index: 3;
  border-radius: 50%;
  overflow: hidden;
  border: 2px solid rgba(222,204,255,.55);
  background: linear-gradient(145deg,#433260,#171124);
  box-shadow:
    0 0 55px rgba(157,100,255,.25),
    inset 0 0 30px rgba(0,0,0,.4);
  animation: circleBreathe 7s ease-in-out infinite alternate;
}

.profile-circle img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  border-radius: 50%;
  position: relative;
  z-index: 2;
}
.profile-circle img.failed { display: none; }

.profile-circle::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  pointer-events: none;
  background: linear-gradient(140deg,rgba(255,255,255,.13),transparent 45%,rgba(90,51,171,.1));
}

.profile-fallback {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font: 800 110px var(--display);
  color: var(--purple);
}

.profile-badge {
  position: absolute;
  z-index: 6;
  padding: 12px 15px;
  border: 1px solid rgba(187,156,255,.38);
  border-radius: 16px;
  background: rgba(23,17,38,.88);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 15px 40px rgba(0,0,0,.35);
  font: 9px var(--mono);
  color: #b9aed0;
  animation: badgeFloat 5s ease-in-out infinite alternate;
}
.profile-badge strong {
  display: block;
  margin-top: 6px;
  color: white;
  font: 700 16px var(--display);
}
.profile-badge.one { top: 13%; right: 0; }
.profile-badge.two {
  bottom: 12%;
  left: 0;
  animation-delay: -2s;
  border-color: rgba(223,255,150,.32);
}
.profile-badge.two strong { color: var(--lime); }

/* ====== MARQUEE ====== */
.link-marquee {
  position: relative;
  z-index: 5;
  overflow: hidden;
  padding: 13px 0;
  border-block: 1px solid var(--line);
  background: rgba(255,255,255,.02);
}
.link-marquee::before,
.link-marquee::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  z-index: 2;
  width: 45px;
  pointer-events: none;
}
.link-marquee::before { left: 0; background: linear-gradient(90deg,var(--bg),transparent); }
.link-marquee::after { right: 0; background: linear-gradient(-90deg,var(--bg),transparent); }

.marquee-track {
  display: flex;
  width: max-content;
  animation: marqueeScroll 43s linear infinite;
  will-change: transform;
}
.link-marquee:hover .marquee-track,
.link-marquee:focus-within .marquee-track { animation-play-state: paused; }

.marquee-set { display: flex; flex: 0 0 auto; gap: 10px; padding-right: 10px; }

.marquee-link {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 12px 15px;
  border: 1px solid rgba(255,255,255,.16);
  border-radius: 100px;
  white-space: nowrap;
  background: rgba(187,156,255,.065);
  font: 600 11px var(--display);
  transition:
    background .25s,
    border-color .25s,
    transform .35s var(--ease-out);
}
.marquee-link:hover {
  background: rgba(187,156,255,.22);
  border-color: rgba(187,156,255,.5);
  transform: translateY(-2px);
}

.marquee-link > svg,
.marquee-link > img {
  width: 17px;
  height: 17px;
  flex-shrink: 0;
}
.marquee-link > svg { fill: currentColor; }

.marquee-link .arrow {
  color: var(--purple);
  display: inline-flex;
}
.marquee-link .arrow .arrow-icon { width: 11px; height: 11px; }

/* ====== ABOUT ====== */
.about-lead {
  color: #aca6b9;
  max-width: 830px;
  font: 500 clamp(26px,6vw,42px)/1.5 var(--display);
  letter-spacing: -.047em;
  margin-top: 30px;
}
.about-lead strong { color: white; }
.about-lead em { font-style: normal; color: var(--purple); }

/* ====== EXPERTISE ====== */
.services { border-top: 1px solid var(--line); margin-top: 35px; }

.service {
  position: relative;
  display: grid;
  grid-template-columns: 35px 1fr 25px;
  gap: 12px;
  align-items: center;
  padding: 25px 0;
  border-bottom: 1px solid var(--line);
  transition: transform .45s var(--ease-out);
}
.service::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 1px;
  background: linear-gradient(90deg,var(--purple),var(--cyan),var(--lime));
  transform: scaleX(0);
  transform-origin: left;
  transition: transform .7s var(--ease-out);
}
.service:hover { transform: translateX(10px); }
.service:hover::after { transform: scaleX(1); }

.service span { font: 10px var(--mono); color: var(--purple); transition: color .35s; }
.service:hover span { color: var(--cyan); }

.service h3 {
  font: 500 clamp(21px,5vw,37px) var(--display);
  letter-spacing: -.05em;
  margin: 0;
  transition: color .35s;
}

.service b {
  color: var(--lime);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: transform .45s var(--ease-out), color .35s;
}
.service b .arrow-icon { width: 20px; height: 20px; }
.service:hover b { transform: translate(4px,-4px); color: var(--cyan); }

/* ====== STUDIO ====== */
.studio-card {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  border: 1px solid rgba(187,156,255,.38);
  border-radius: 29px;
  background:
    radial-gradient(ellipse at 70% 15%,rgba(143,84,248,.28),transparent 62%),
    linear-gradient(145deg,#231934,#0e0b1b 80%);
  padding: 35px 20px;
  text-align: center;
  box-shadow: 0 35px 100px rgba(0,0,0,.3);
}

.studio-card::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(255,255,255,.027) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.027) 1px,transparent 1px);
  background-size: 48px 48px;
  mask-image: radial-gradient(ellipse at 50% 40%,#000,transparent 78%);
  -webkit-mask-image: radial-gradient(ellipse at 50% 40%,#000,transparent 78%);
}

.studio-kicker {
  font: 9px/1.8 var(--mono);
  letter-spacing: .12em;
  color: #ccb8ea;
}

.logo-stage { width: 250px; max-width: 100%; margin: 25px auto 18px; }

.logo-circle {
  position: absolute;
  inset: 22%;
  z-index: 3;
  display: grid;
  place-items: center;
  overflow: hidden;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,.44);
  background: linear-gradient(145deg,#bd9cff,#5c3da9);
  box-shadow: 0 0 70px rgba(157,96,255,.35);
  animation: circleBreathe 7s ease-in-out infinite alternate;
}
.logo-circle img {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  border-radius: 50%;
}
.logo-circle img.failed { display: none; }

.logo-fallback {
  position: absolute;
  font: 800 87px var(--display);
  letter-spacing: -.13em;
  padding-right: 12px;
}
.logo-fallback span { color: #271544; }

.studio-name {
  position: relative;
  z-index: 6;
  display: block;
  max-width: 100%;
  margin: 0 auto 17px;
  font: 700 clamp(32px,10.4vw,112px)/1.1 var(--display);
  letter-spacing: -.09em;
  white-space: nowrap;
}
.studio-name span { color: var(--purple); }

.studio-tagline {
  font: 600 clamp(23px,5.8vw,36px)/1.3 var(--display);
  letter-spacing: -.05em;
  margin: 0 0 18px;
}

.studio-desc {
  max-width: 550px;
  margin: 0 auto;
  color: #bdb4cf;
  font-size: 12px;
  line-height: 1.95;
}

.studio-actions {
  display: grid;
  gap: 11px;
  max-width: 510px;
  margin: 27px auto 0;
}

.studio-footer {
  margin-top: 32px;
  color: #a79abc;
  font: 9px var(--mono);
  letter-spacing: .12em;
}

/* ====== NETWORK CARDS ====== */
.network {
  display: grid;
  grid-template-columns: 1fr;
  gap: 13px;
  margin-top: 25px;
}

.brand-card {
  --rgb: 187,156,255;
  --accent: var(--purple);
  --rx: 0deg;
  --ry: 0deg;
  --ty: 0px;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 235px;
  padding: 23px;
  border: 1px solid rgba(var(--rgb),.33);
  border-radius: 22px;
  background: linear-gradient(130deg,rgba(var(--rgb),.14),rgba(255,255,255,.018));
  transform: perspective(1000px) rotateX(var(--rx)) rotateY(var(--ry)) translateY(var(--ty));
  transform-style: preserve-3d;
  transition:
    transform .5s var(--ease-out),
    border-color .35s,
    box-shadow .35s;
}

.brand-card:hover {
  --ty: -6px;
  border-color: rgba(var(--rgb),.8);
  box-shadow: 0 28px 65px rgba(0,0,0,.35);
}

.brand-card::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  background: linear-gradient(115deg,transparent 30%,rgba(255,255,255,.1) 50%,transparent 70%);
  transform: translateX(-100%);
  transition: transform .9s var(--ease-out);
}
.brand-card:hover::before { transform: translateX(100%); }

.brand-card::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(circle at var(--mx,80%) var(--my,20%),rgba(var(--rgb),.17),transparent 65%);
}

.brand-card.website { --rgb: 140,236,229; --accent: #8cece5; }
.brand-card.github { --rgb: 231,232,245; --accent: #f5f5ff; }
.brand-card.instagram { --rgb: 255,145,199; --accent: #ffa0d1; }
.brand-card.linktree { --rgb: 145,239,175; --accent: #9af3ad; }

.brand-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  position: relative;
  z-index: 2;
}

.brand-icon {
  display: grid;
  place-items: center;
  width: 58px;
  height: 58px;
  border-radius: 17px;
  border: 1px solid rgba(var(--rgb),.43);
  background: rgba(var(--rgb),.1);
  color: var(--accent);
  transition: transform .5s var(--ease-out), background .35s;
}
.brand-card:hover .brand-icon {
  transform: translateZ(28px) scale(1.06);
  background: rgba(var(--rgb),.18);
}
.brand-icon svg,
.brand-icon img { width: 31px; height: 31px; fill: currentColor; }

.brand-corner { display: flex; align-items: center; gap: 12px; }

.mini-logo-top {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid rgba(var(--rgb),.5);
  box-shadow: 0 4px 15px rgba(0,0,0,.4);
  opacity: .85;
  transition: opacity .3s, transform .4s var(--ease-out);
}
.brand-card:hover .mini-logo-top { opacity: 1; transform: scale(1.1); }

.brand-arrow {
  display: inline-flex;
  color: var(--accent);
  transition: transform .5s var(--ease-out);
}
.brand-arrow .arrow-icon { width: 22px; height: 22px; }
.brand-card:hover .brand-arrow { transform: translate(5px,-5px); }

.brand-bottom { position: relative; z-index: 2; margin-top: 25px; }
.brand-bottom small {
  font: 9px var(--mono);
  letter-spacing: .13em;
  color: var(--accent);
}
.brand-bottom h3 {
  font: 600 31px var(--display);
  letter-spacing: -.06em;
  margin: 10px 0;
}
.brand-bottom p {
  margin: 0;
  color: #b2a9c0;
  font-size: 12px;
  line-height: 1.7;
}
.brand-handle {
  display: block;
  color: var(--accent);
  font: 10px var(--mono);
  margin-top: 15px;
  overflow-wrap: anywhere;
}

/* ====== PERSONAL LINKS ====== */
.social-grid { display: grid; gap: 12px; }

.social-card {
  display: flex;
  align-items: center;
  gap: 13px;
  min-height: 90px;
  padding: 17px;
  border: 1px solid var(--line);
  border-radius: 19px;
  background: rgba(255,255,255,.04);
  transition:
    transform .45s var(--ease-out),
    border-color .35s,
    background .35s;
}
.social-card:hover {
  transform: translateY(-5px);
  border-color: rgba(187,156,255,.55);
  background: rgba(187,156,255,.08);
}

.social-icon {
  flex-shrink: 0;
  display: grid;
  place-items: center;
  width: 50px;
  height: 50px;
  border-radius: 15px;
  background: rgba(187,156,255,.11);
  transition: transform .45s var(--ease-out);
}
.social-card:hover .social-icon { transform: scale(1.08) rotate(-4deg); }
.social-icon svg,
.social-icon img { width: 27px; height: 27px; fill: currentColor; }

.social-card strong { display: block; font: 600 17px var(--display); }
.social-card small {
  display: block;
  margin-top: 5px;
  color: #a99fba;
  font: 10px var(--mono);
  overflow-wrap: anywhere;
}

.social-arrow {
  margin-left: auto;
  color: var(--lime);
  display: inline-flex;
  transition: transform .45s var(--ease-out);
}
.social-arrow .arrow-icon { width: 15px; height: 15px; }
.social-card:hover .social-arrow { transform: translate(4px,-4px); }

/* ====== CONTACT ====== */
.contact {
  position: relative;
  text-align: center;
  padding: 120px 0 110px;
  border-top: 1px solid var(--line);
}
.contact::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 25px;
  transform: translateX(-50%);
  width: 90%;
  height: 320px;
  background: radial-gradient(ellipse,rgba(148,90,240,.23),transparent 70%);
  filter: blur(28px);
  pointer-events: none;
  animation: haloPulse 9s ease-in-out infinite alternate;
}
.contact .container { position: relative; }

.contact h2 {
  font: 700 clamp(65px,16vw,138px)/.93 var(--display);
  letter-spacing: -.09em;
  margin: 27px 0;
}
.contact h2 span { color: var(--purple); }
.contact p {
  max-width: 440px;
  margin: 0 auto 30px;
  color: #aaa3b9;
  font-size: 12px;
  line-height: 1.9;
}

.email {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  max-width: 100%;
  padding: 17px;
  border-radius: 18px;
  border: 1px solid rgba(187,156,255,.47);
  background: rgba(187,156,255,.1);
  font: 600 clamp(11px,3vw,17px) var(--display);
  overflow-wrap: anywhere;
  transition:
    transform .45s var(--ease-out),
    background .3s,
    box-shadow .4s,
    border-color .3s;
}
.email:hover {
  transform: translateY(-4px);
  background: rgba(187,156,255,.2);
  border-color: rgba(187,156,255,.85);
  box-shadow: 0 22px 55px rgba(140,90,240,.28);
}

.email > svg:first-child {
  width: 17px;
  height: 17px;
  flex-shrink: 0;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.email .arrow-icon {
  width: 14px;
  height: 14px;
  margin-left: 2px;
}
.email:hover .arrow-icon { transform: translate(3px, -3px); }

/* ====== FOOTER ====== */
.footer {
  border-top: 1px solid var(--line);
  padding: 28px 0 38px;
}
.footer-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.footer .logo { font-size: clamp(18px,4vw,24px); letter-spacing: -.055em; }
.footer p { margin: 0; color: #9d94ad; font: 9px/1.6 var(--mono); }

.footer .top {
  color: var(--lime);
  font: 10px var(--mono);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: transform .4s var(--ease-out);
}
.footer .top .arrow-icon { width: 10px; height: 10px; }
.footer .top:hover { transform: translateY(-3px); }

/* ====== BACK TO TOP ====== */
.back-to-top {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 90;
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 1px solid rgba(187,156,255,.4);
  background: rgba(19,15,32,.85);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  color: var(--lime);
  cursor: pointer;
  opacity: 0;
  visibility: hidden;
  transform: translateY(20px) scale(.9);
  transition:
    opacity .4s var(--ease-out),
    visibility .4s var(--ease-out),
    transform .5s var(--ease-out),
    border-color .3s,
    background .3s;
}
.back-to-top.visible { opacity: 1; visibility: visible; transform: none; }
.back-to-top:hover {
  border-color: var(--lime);
  background: rgba(223,255,150,.1);
  transform: translateY(-2px);
}
.back-to-top:focus-visible { outline-offset: 4px; }

.back-to-top .btt-ring {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}
.back-to-top .btt-arrow {
  position: relative;
  width: 16px;
  height: 16px;
  color: var(--lime);
}

.btt-track, .btt-progress {
  fill: none;
  stroke-width: 1.5;
}
.btt-track { stroke: rgba(255,255,255,.1); }
.btt-progress {
  stroke: var(--lime);
  stroke-dasharray: 106.81;
  stroke-dashoffset: 106.81;
  stroke-linecap: round;
  transition: stroke-dashoffset .12s linear;
  filter: drop-shadow(0 0 4px var(--lime));
}

/* ====== REVEALS ====== */
.js .reveal {
  opacity: 0;
  transform: translateY(38px);
  filter: blur(6px);
  transition:
    opacity .9s var(--ease-out),
    transform .9s var(--ease-out),
    filter .9s var(--ease-out);
  transition-delay: var(--reveal-delay, 0ms);
  will-change: opacity, transform;
}
.js .reveal.visible {
  opacity: 1;
  transform: none;
  filter: blur(0);
  will-change: auto;
}

.js .hero-title span {
  opacity: 0;
  transform: translateY(50px) rotateX(-25deg);
  filter: blur(8px);
  transform-origin: 50% 100%;
  transition:
    opacity 1.1s var(--ease-out),
    transform 1.2s var(--ease-out),
    filter 1s var(--ease-out);
}
.js .hero-title.visible span {
  opacity: 1;
  transform: none;
  filter: blur(0);
}
.js .hero-title.visible span:nth-child(2) { transition-delay: .12s; }
.js .hero-title.visible span:nth-child(3) { transition-delay: .24s; }

/* ====== KEYFRAMES ====== */
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes spinReverse { to { transform: rotate(-360deg); } }
@keyframes gradientFlow { to { background-position: 100% 0; } }
@keyframes aurora { to { transform: translate(8%,5%) scale(1.1); } }
@keyframes haloPulse { to { opacity: .5; transform: scale(1.16); } }
@keyframes badgeFloat { to { translate: 0 -12px; } }
@keyframes circleBreathe {
  to {
    box-shadow:
      0 0 85px rgba(157,100,255,.42),
      inset 0 0 30px rgba(0,0,0,.4);
  }
}
@keyframes dotPulse {
  50% { opacity: .45; transform: scale(.78); }
}
@keyframes statusPulse {
  50% { opacity: .4; box-shadow: 0 0 4px var(--lime); }
}
@keyframes eyebrowLine {
  from { transform: scaleX(.35); opacity: .5; }
  to { transform: scaleX(1); opacity: 1; }
}
@keyframes marqueeScroll { to { transform: translateX(-50%); } }
@keyframes loadingBar {
  from { transform: scaleX(0); }
  to { transform: scaleX(1); }
}
@keyframes loaderOrbIn {
  from { opacity: 0; transform: scale(.82); }
  to { opacity: 1; transform: scale(1); }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: none; }
}

/* ====== SMALL PHONES ====== */
@media (max-width:370px) {
  .hero-title { font-size: 59px; }
  .profile-stage { width: 330px; max-width: 100%; }
  .profile-badge { padding: 10px; font-size: 8px; }
  .profile-badge strong { font-size: 13px; }
  .studio-name { font-size: 30px; }
  .btn { font-size: 9px; padding-inline: 14px; }
  .back-to-top { bottom: 16px; right: 16px; width: 44px; height: 44px; }
}

/* ====== TABLET ====== */
@media (min-width:700px) {
  .container { width: min(1160px,calc(100% - 70px)); }
  .hero { padding-top: 175px; min-height: 850px; }
  .hero-title { font-size: clamp(90px,10vw,140px); }
  .section { padding: 125px 0; }
  .studio-card { padding: 65px 50px; }
  .logo-stage { width: 280px; }
  .studio-actions { grid-template-columns: 1fr 1fr; }
  .network { grid-template-columns: repeat(2,1fr); gap: 16px; }
  .social-grid { grid-template-columns: repeat(3,1fr); }
}

/* ====== DESKTOP ====== */
@media (min-width:1020px) {
  .hero { min-height: 830px; padding: 190px 0 110px; }
  .hero-grid {
    display: grid;
    grid-template-columns: 1.05fr .95fr;
    align-items: center;
    gap: 35px;
  }
  .profile-stage { width: 460px; }
  .hero-desc { font-size: 14px; }
  .network { grid-template-columns: repeat(4,minmax(0,1fr)); }
  .brand-card { min-height: 290px; }
  .brand-bottom h3 { font-size: 26px; }
  .logo-stage { width: 300px; }
  .studio-name { font-size: 110px; }

  .nav-links a {
    padding: 12px;
    font-size: 10px;
  }
  .nav-links .special { padding-inline: 20px; }
}

/* ====== REDUCED MOTION ====== */
@media (prefers-reduced-motion:reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
  .js .reveal {
    opacity: 1 !important;
    transform: none !important;
    filter: none !important;
  }
  .js .hero-title span { opacity: 1 !important; transform: none !important; filter: none !important; }
  .link-marquee { overflow-x: auto; }
  .marquee-track { animation: none !important; }
  .cursor-dot, .cursor-ring { display: none !important; }
}
</style>
</head>
